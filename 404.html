<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>页面不存在 · 知域</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var segments = location.pathname.split("/").filter(Boolean);
        var root = segments.length ? "/" + segments[0] + "/" : "/";
        var rest = "/" + segments.slice(1).join("/");
        var deck = rest.match(/^\/slides\/([^/]+)\/\d+\/?$/);
        location.replace(deck ? root + "slides/" + deck[1] + "/" : root);
      })();
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf9f5; color: #162427; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      p { font-size: 15px; color: #47585c; }
      a { color: #0b6b68; }
    </style>
  </head>
  <body>
    <p>页面不存在，正在返回 <a href="/">知域首页</a>…</p>
  </body>
</html>
